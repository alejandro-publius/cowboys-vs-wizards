name: Frontier paired balance gate
description: Check both sides and opening-seat skew on matched tune and holdout games
inputs:
  plan:
    description: Path to the caller's JSON seed plan
    required: true
  evidence:
    description: Path to the caller's recorded pairs in JSON
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GATE_DIR: ${{ github.action_path }}
        PLAN: ${{ inputs.plan }}
        EVIDENCE: ${{ inputs.evidence }}
      run: node "$GATE_DIR/balance-gate.mjs" "$PLAN" "$EVIDENCE"
