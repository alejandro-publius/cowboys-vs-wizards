name: Verify Showdown trap counterplay in Chrome
on:
  push:
    branches: [verify/outrider-opening-20261125]
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CANDIDATE: fcc863cfb16fc71330e60af8ab89c743f04b1879
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fcc863cfb16fc71330e60af8ab89c743f04b1879
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Verify source revision and install locked dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git fetch --depth=1 origin eedab9385931e093e156fdb7885c470eb2ec64eb
          npm ci
      - name: Run the repository checks on the candidate
        run: npm test
      - name: Play the staged entry on the software-rendered board
        run: |
          node scripts/stage-pages.mjs --commit "$CANDIDATE"
          cat > "$RUNNER_TEMP/showdown-chrome" <<'SH'
          #!/bin/sh
          exec google-chrome --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader "$@"
          SH
          chmod 700 "$RUNNER_TEMP/showdown-chrome"
          CHROME="$RUNNER_TEMP/showdown-chrome" node scripts/check-pages-tree.mjs --commit "$CANDIDATE" --browser
          CHROME_PATH="$RUNNER_TEMP/showdown-chrome" node scripts/browser-showdown-deck-check.mjs dist/web/graybox/index.html
      - name: Confirm the same browser check catches the old attack forecast
        env:
          BEFORE: ccbf566ee7f56a062944054439fcdbef573f2b6a
        run: |
          git fetch --depth=1 origin "$BEFORE"
          git worktree add --detach "$RUNNER_TEMP/pre-trap-warning" "$BEFORE"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/pre-trap-warning/node_modules"
          (cd "$RUNNER_TEMP/pre-trap-warning" && node scripts/stage-pages.mjs --commit "$BEFORE")
          if CHROME="$RUNNER_TEMP/showdown-chrome" node scripts/check-pages-tree.mjs --commit "$BEFORE" --dir "$RUNNER_TEMP/pre-trap-warning/dist/web" --browser --out-dir "$RUNNER_TEMP/negative-report" > "$RUNNER_TEMP/baseline.log" 2>&1; then
            echo "Expected the old preview to lack the trap warning"
            exit 1
          fi
          grep -F 'the aiming prompt and illustrated board explain the public trap risk' "$RUNNER_TEMP/baseline.log"
