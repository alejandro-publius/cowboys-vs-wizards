name: Verify Showdown rewards and replay in Chrome
on:
  push:
    branches: [verify/outrider-opening-20261125]
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CANDIDATE: a8900e2e1d66bca194924cd923f646004743e2f1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a8900e2e1d66bca194924cd923f646004743e2f1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Verify source revision and install locked dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git fetch --depth=1 origin eedab9385931e093e156fdb7885c470eb2ec64eb
          npm ci
      - name: Run the repository checks on the candidate
        run: npm test
      - name: Play the staged entry on the software-rendered board
        run: |
          node scripts/stage-pages.mjs --commit "$CANDIDATE"
          cat > "$RUNNER_TEMP/showdown-chrome" <<'SH'
          #!/bin/sh
          exec google-chrome --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader "$@"
          SH
          chmod 700 "$RUNNER_TEMP/showdown-chrome"
          CHROME="$RUNNER_TEMP/showdown-chrome" node scripts/check-pages-tree.mjs --commit "$CANDIDATE" --browser
          CHROME_PATH="$RUNNER_TEMP/showdown-chrome" node scripts/browser-showdown-deck-check.mjs dist/web/graybox/index.html
