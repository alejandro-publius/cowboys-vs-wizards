name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # README requires Node.js 22.18 or later; 22 resolves to the latest 22.x.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The Billy, Ride and Boot Hill receipts bind the engine and decks to four revisions.
      - name: Fetch engines for the recorded replays
        run: >
          git fetch --no-tags --depth=1 https://github.com/alejandro-publius/cowboys-vs-wizards.git
          eedab9385931e093e156fdb7885c470eb2ec64eb
          bf510f305058850a03cdcf9e7b7181a428f38288
          1908eaaa5d995d6f5589d4fbc4a2c30b83e02683
          2fcf39b7fe4db6f78cb33f6b2c474e053e89bbc7

      - run: npm ci

      - run: npm test

      # Stage the illustrated challenge, lightweight fallback and reference page.
      - name: Stage and check the Pages tree
        run: |
          node scripts/stage-pages.mjs --commit "$GITHUB_SHA"
          node scripts/check-pages-tree.mjs --commit "$GITHUB_SHA"

      - name: Kiro review Power tests
        run: node --test .kiro/powers/orb-duel-review/test/*.test.mjs

      - name: Replay Room lessons and Crew bundle
        run: |
          node --test apps/replay-room/test/*.test.mjs
          node apps/replay-room/build.mjs --check

      - name: Night Watch unit tests
        working-directory: apps/night-watch/backend
        run: python3 -m unittest test_night_watch
