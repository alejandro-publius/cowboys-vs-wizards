name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # README requires Node.js 22.18 or later; 22 resolves to the latest 22.x.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build -- --web

      - name: Kiro review server tests
        run: node --test .kiro/powers/orb-duel-review/test/server.test.mjs

      - name: Night Watch unit tests
        working-directory: apps/night-watch/backend
        run: python3 -m unittest test_night_watch
