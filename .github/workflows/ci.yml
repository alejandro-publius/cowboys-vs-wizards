name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # README requires Node.js 22.18 or later; 22 resolves to the latest 22.x.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The paired Billy replay compares the recorded engine, decks and bots at this revision.
      - name: Fetch the frozen Billy replay inputs
        run: git fetch --no-tags --depth=1 https://github.com/alejandro-publius/cowboys-vs-wizards.git eedab9385931e093e156fdb7885c470eb2ec64eb

      - run: npm ci

      - run: npm test

      # Stage the illustrated challenge, lightweight fallback and reference page.
      - name: Stage and check the Pages tree
        run: |
          node scripts/stage-pages.mjs --commit "$GITHUB_SHA"
          node scripts/check-pages-tree.mjs --commit "$GITHUB_SHA"

      - name: Kiro review server tests
        run: node --test .kiro/powers/orb-duel-review/test/server.test.mjs

      - name: Night Watch unit tests
        working-directory: apps/night-watch/backend
        run: python3 -m unittest test_night_watch
