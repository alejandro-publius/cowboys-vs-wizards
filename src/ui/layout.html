<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cowboys vs. Wizards | Board Duel</title>
<style>
:root{color-scheme:dark;font-family:"Instrument Sans",system-ui,sans-serif;color:#f4e9d9;background:#211923;--gold:#eab979;--violet:#dfadef}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}[hidden]{display:none!important}
#arena{position:relative;isolation:isolate;width:100%;height:100dvh;min-height:450px;overflow:hidden;background:#211923}
#stage{position:absolute;inset:0}#stage canvas{display:block;width:100%;height:100%}
header{position:absolute;z-index:1;inset:0 0 auto;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:clamp(17px,2.7vw,36px);background:linear-gradient(#17101bd6,transparent);pointer-events:none}
h1{margin:0;color:#fff0dd;font:600 clamp(27px,3.5vw,50px)/1 "Cormorant Garamond",Georgia,serif;letter-spacing:-.045em;text-shadow:0 2px 18px #140a16}
.tools{display:flex;gap:8px;pointer-events:auto}
button{min-height:38px;border:1px solid #e8b98b59;border-radius:7px;background:#2d2330ee;color:#fff0df;padding:8px 12px;font-size:13px;font-weight:650;white-space:nowrap}
button:hover{border-color:#e9c095;background:#3d2b3b}button:focus-visible{outline:3px solid #ffdfaf;outline-offset:3px}button:disabled{opacity:.55;cursor:default}
button[aria-pressed=true]{border-color:#d6a774;background:#473047}
#boot{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#efd9e8;z-index:2}
#fallback{position:absolute;inset:75px 0 0;display:grid;justify-items:center;align-content:center;gap:9px}
#fallback video{width:min(100%,1280px);max-height:calc(100dvh - 118px);object-fit:contain}
#fallback p{margin:0;padding:0 12px;text-align:center;color:#dfc9df;font-size:13px}
#controls{position:absolute;inset:auto 0 0;padding:13px 16px clamp(12px,2.3dvh,24px);background:linear-gradient(transparent,#19111be8 53%);}
#status{min-height:19px;margin:0 auto 9px;text-align:center;color:#f6e6d5;font-size:13px}
#combatants{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:437px;margin:0 auto 10px}
.fighter{color:var(--gold);display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 8px;font-size:13px;font-weight:700}
.fighter.wizard{color:var(--violet)}
meter{width:100%;height:6px;grid-column:1/-1;background:#ffffff17;border:0}
meter::-webkit-meter-bar{background:#ffffff17;border:0}meter::-webkit-meter-optimum-value{background:currentColor}
.moves{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.action{min-width:120px;min-height:39px;text-align:left}.action kbd{margin-left:8px;opacity:.66;font-family:"IBM Plex Mono",monospace;font-size:10px}
#fire{border-color:#c8925a;color:#ffd4a5}#cast{border-color:#a073b7;color:#eabef7}
#watch{background:#edd0aa;color:#2a1d24;border-color:#f0d9bd}#watch:hover{background:#fae0bf}
@media(max-width:650px){header{padding:14px;gap:7px}h1{font-size:clamp(20px,5vw,34px)}.tools{gap:4px}.tools button{padding:7px;font-size:10px}.moves{gap:5px}.action{min-width:0;padding:9px;font-size:12px}.action kbd{display:none}#combatants{gap:15px}}
/* Mode switch: the card match (default) or the attack demo. It sits left of the demo tools. */
#modes{margin-left:auto}
@@MATCHSTYLE@@
</style>
</head>
<body>
<main id="arena">
  <div id="stage" aria-label="Three-dimensional Cowboys vs. Wizards board"></div>
  <header>
    <h1>Cowboys vs. Wizards</h1>
    <div class="tools" id="modes" hidden><button id="mode" type="button">Attack demo</button></div>
    <div class="tools" id="tools" hidden>
      <button id="camera" type="button" aria-pressed="true">Duel camera</button>
      <button id="sound" type="button" aria-pressed="false">Sound</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </header>
  <div id="boot" role="status">Loading the board…</div>
  <section id="fallback" aria-label="Recorded exchange" hidden>
    <video id="recording" controls playsinline preload="none" poster="data:image/jpeg;base64,@@POSTER@@"></video>
    <p>Showing the recorded exchange. Open this file in a WebGL 2 browser to control the duel.</p>
  </section>
  <section id="controls" aria-label="Attack controls" hidden>
    <p id="status" role="status">Choose an attack or play the exchange.</p>
    <div id="combatants">
      <div class="fighter"><span>Billy the Kid</span><span id="billy-hp">100</span><meter id="billy-meter" aria-label="Billy's health" min="0" max="100" value="100"></meter></div>
      <div class="fighter wizard"><span>The Wizard</span><span id="wizard-hp">100</span><meter id="wizard-meter" aria-label="Wizard's health" min="0" max="100" value="100"></meter></div>
    </div>
    <div class="moves">
      <button class="action" id="fire" type="button">Draw &amp; fire <kbd>1</kbd></button>
      <button class="action" id="cast" type="button">Singularity <kbd>2</kbd></button>
      <button class="action" id="watch" type="button">Play exchange <kbd>Space</kbd></button>
    </div>
  </section>
  <section id="match" aria-label="Orb Duel match" hidden></section>
</main>
<script id="models" type="application/json">@@ASSETS@@</script>
<script id="video-data" type="application/octet-stream">@@VIDEO@@</script>
<script>@@SCRIPT@@</script>
</body></html>
