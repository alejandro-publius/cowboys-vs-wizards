<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cowboys vs. Wizards | Board Duel</title>
<style>
:root{color-scheme:dark;font-family:"Instrument Sans",system-ui,sans-serif;color:#f4e9d9;background:#211923;--gold:#eab979;--violet:#dfadef}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}[hidden]{display:none!important}
#arena{position:relative;isolation:isolate;width:100%;height:100dvh;min-height:450px;overflow:hidden;background:#211923}
#stage{position:absolute;inset:0}#stage canvas{display:block;width:100%;height:100%}
header{position:absolute;z-index:1;inset:0 0 auto;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:clamp(17px,2.7vw,36px);background:linear-gradient(#17101bd6,transparent);pointer-events:none}
h1{margin:0;color:#fff0dd;font:600 clamp(27px,3.5vw,50px)/1 "Cormorant Garamond",Georgia,serif;letter-spacing:-.045em;text-shadow:0 2px 18px #140a16}
.tools{display:flex;gap:8px;pointer-events:auto}
button{min-height:38px;border:1px solid #e8b98b59;border-radius:7px;background:#2d2330ee;color:#fff0df;padding:8px 12px;font-size:13px;font-weight:650;white-space:nowrap}
button:hover{border-color:#e9c095;background:#3d2b3b}button:focus-visible{outline:3px solid #ffdfaf;outline-offset:3px}button:disabled{opacity:.55;cursor:default}
button[aria-pressed=true]{border-color:#d6a774;background:#473047}
#boot{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#efd9e8;z-index:2}
#fallback{position:absolute;inset:75px 0 0;display:grid;justify-items:center;align-content:center;gap:9px}
#fallback video{width:min(100%,1280px);max-height:calc(100dvh - 118px);object-fit:contain}
#fallback p{margin:0;padding:0 12px;text-align:center;color:#dfc9df;font-size:13px}
#controls{position:absolute;inset:auto 0 0;padding:13px 16px clamp(12px,2.3dvh,24px);background:linear-gradient(transparent,#19111be8 53%);}
#status{min-height:19px;margin:0 auto 9px;text-align:center;color:#f6e6d5;font-size:13px}
#combatants{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:437px;margin:0 auto 10px}
.fighter{color:var(--gold);display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 8px;font-size:13px;font-weight:700}
.fighter.wizard{color:var(--violet)}
meter{width:100%;height:6px;grid-column:1/-1;background:#ffffff17;border:0}
meter::-webkit-meter-bar{background:#ffffff17;border:0}meter::-webkit-meter-optimum-value{background:currentColor}
.moves{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.action{min-width:120px;min-height:39px;text-align:left}.action kbd{margin-left:8px;opacity:.66;font-family:"IBM Plex Mono",monospace;font-size:10px}
#fire{border-color:#c8925a;color:#ffd4a5}#cast{border-color:#a073b7;color:#eabef7}
#watch{background:#edd0aa;color:#2a1d24;border-color:#f0d9bd}#watch:hover{background:#fae0bf}
@media(max-width:650px){header{padding:14px;gap:7px}h1{font-size:clamp(20px,5vw,34px)}.tools{gap:4px}.tools button{padding:7px;font-size:10px}.moves{gap:5px}.action{min-width:0;padding:9px;font-size:12px}.action kbd{display:none}#combatants{gap:15px}}
/* Mode switch: the card match (default) or the attack demo. It sits left of the demo tools. */
#modes{margin-left:auto}
/* Orb Duel overlay. Card fronts are temporary text cards; the card back is the approved import. */
#match{position:absolute;inset:0;z-index:0;pointer-events:none;font-size:13px;--card-back:url("data:image/png;base64,@@CARDBACK@@")}
.match-panel{pointer-events:auto;background:#19111bd9;border:1px solid #e8b98b40;border-radius:9px;padding:8px 11px;box-shadow:0 6px 24px #0007}
.match-top{position:absolute;top:calc(clamp(17px,2.7vw,36px) + clamp(27px,3.5vw,50px) + 12px);left:clamp(12px,2.7vw,36px);display:grid;gap:7px;justify-items:start;max-width:calc(100% - 24px)}
.match-details p{margin:0 0 5px;color:#fff0dd;font-weight:650}
.match-line{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.match-muted{color:#cdb8c9;font-size:11px}.match-details code{font-family:"IBM Plex Mono",monospace;color:var(--gold)}
.match-seed{display:flex;gap:5px}
.match-seed input{width:10ch;min-height:32px;border:1px solid #e8b98b59;border-radius:7px;background:#120c14;color:#fff0df;padding:4px 8px;font:inherit;font-size:12px}
.match-seed input:focus-visible{outline:3px solid #ffdfaf;outline-offset:2px}
#match .match-line button{min-height:32px;padding:5px 10px;font-size:12px}
.match-opponent{display:flex;gap:12px;align-items:center;color:var(--violet)}.match-side,.match-base{font-weight:700;white-space:nowrap}
.card-back{display:inline-block;width:30px;aspect-ratio:530/742;background:var(--card-back) center/contain no-repeat;filter:drop-shadow(0 1px 2px #000b)}
.match-backs{display:flex;min-width:30px;min-height:42px}.match-backs .card-back+.card-back{margin-left:-17px}
.match-pile{position:relative;display:inline-grid;place-items:center}.match-pile .card-back{width:34px}.match-pile.empty .card-back{opacity:.3}
.match-count{position:absolute;bottom:-5px;right:-9px;min-width:20px;padding:1px 5px;border-radius:9px;background:#120c14;border:1px solid #e8b98b66;color:#fff0dd;font-size:11px;font-weight:700;text-align:center}
.match-bottom{position:absolute;inset:auto 0 0;display:grid;gap:6px;justify-items:center;padding:28px 14px clamp(10px,2.2dvh,22px);background:linear-gradient(transparent,#19111bed 34%)}
.match-prompt,.match-message{margin:0;text-align:center;min-height:18px}.match-prompt{color:#f6e6d5}.match-message{color:#ffd4a5;font-weight:650}
.match-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;max-width:100%}
.match-lanes,.match-hand,.match-own,.match-buttons{pointer-events:auto}
.match-lanes{display:grid;grid-auto-flow:column;grid-template-rows:auto auto;grid-auto-columns:minmax(0,118px);gap:4px}
#match .match-slot{min-height:30px;padding:4px 8px;font-size:11px;font-weight:600;text-align:left;overflow:hidden;text-overflow:ellipsis;border-color:#e8b98b45;color:var(--gold)}
#match .match-slot[data-side=wizard]{border-color:#a073b766;color:var(--violet)}
#match .match-slot:disabled{opacity:.88}#match .match-slot:not(:disabled){box-shadow:0 0 0 2px #ffd38a99;background:#3d2b3b}
#match .match-slot[aria-pressed=true]{box-shadow:0 0 0 2px #ffdfaf;background:#5a3b37}
.match-hand{display:flex;gap:7px;overflow-x:auto;max-width:100%;padding:8px 2px 2px}
#match .card-front{flex:none;width:94px;min-height:114px;display:grid;align-content:start;gap:3px;padding:8px;border:1px dashed #eab97999;border-radius:8px;background:#2a1f2cf2;text-align:left;white-space:normal;line-height:1.2}
#match .card-front[aria-pressed=true]{border-style:solid;border-color:var(--gold);background:#3f2c33;transform:translateY(-6px);box-shadow:0 0 0 2px #eab97966}
#match .card-front:disabled{opacity:.72}
.card-name{color:#fff0dd;font-size:13px;font-weight:700}.card-tier{color:var(--gold);font-size:11px}.card-stats{color:#e7d6e4;font-size:11px}
.card-temp{margin-top:4px;color:#bfa9b9;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase}
.match-own{display:flex;gap:14px;align-items:center;color:var(--gold)}
.match-buttons{display:grid;grid-template-columns:auto auto;gap:5px}#match .match-buttons button{min-height:34px;padding:6px 11px;font-size:12px}
#match [data-action=end-phase]:not(:disabled){border-color:#c8925a;color:#ffd4a5}
.match-result{position:absolute;inset:0;display:grid;place-items:center;background:#140b16a6;pointer-events:auto}
.match-result .match-panel{display:grid;justify-items:center;gap:10px;padding:22px 34px;text-align:center}
.match-result h2{margin:0;color:#fff0dd;font:600 clamp(42px,7vw,82px)/1 "Cormorant Garamond",Georgia,serif;letter-spacing:-.03em}
.match-result[data-outcome=win] h2{color:var(--gold)}.match-result[data-outcome=loss] h2{color:var(--violet)}.match-result p{margin:0;color:#e7d6e4}
@media(max-width:650px){.match-top{top:calc(38px + clamp(20px,5vw,34px));left:10px}.match-panel{padding:6px 8px}#match .card-front{width:80px;min-height:100px;padding:6px}.match-lanes{grid-auto-columns:minmax(0,96px)}.match-bottom{padding:20px 8px 10px}}
</style>
</head>
<body>
<main id="arena">
  <div id="stage" aria-label="Three-dimensional Cowboys vs. Wizards board"></div>
  <header>
    <h1>Cowboys vs. Wizards</h1>
    <div class="tools" id="modes" hidden><button id="mode" type="button">Attack demo</button></div>
    <div class="tools" id="tools" hidden>
      <button id="camera" type="button" aria-pressed="true">Duel camera</button>
      <button id="sound" type="button" aria-pressed="false">Sound</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </header>
  <div id="boot" role="status">Loading the board…</div>
  <section id="fallback" aria-label="Recorded exchange" hidden>
    <video id="recording" controls playsinline preload="none" poster="data:image/jpeg;base64,@@POSTER@@"></video>
    <p>Showing the recorded exchange. Open this file in a WebGL 2 browser to control the duel.</p>
  </section>
  <section id="controls" aria-label="Attack controls" hidden>
    <p id="status" role="status">Choose an attack or play the exchange.</p>
    <div id="combatants">
      <div class="fighter"><span>Billy the Kid</span><span id="billy-hp">100</span><meter id="billy-meter" aria-label="Billy's health" min="0" max="100" value="100"></meter></div>
      <div class="fighter wizard"><span>The Wizard</span><span id="wizard-hp">100</span><meter id="wizard-meter" aria-label="Wizard's health" min="0" max="100" value="100"></meter></div>
    </div>
    <div class="moves">
      <button class="action" id="fire" type="button">Draw &amp; fire <kbd>1</kbd></button>
      <button class="action" id="cast" type="button">Singularity <kbd>2</kbd></button>
      <button class="action" id="watch" type="button">Play exchange <kbd>Space</kbd></button>
    </div>
  </section>
  <section id="match" aria-label="Orb Duel match" hidden></section>
</main>
<script id="models" type="application/json">@@ASSETS@@</script>
<script id="video-data" type="application/octet-stream">@@VIDEO@@</script>
<script>@@SCRIPT@@</script>
</body></html>
