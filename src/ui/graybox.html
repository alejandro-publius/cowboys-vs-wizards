<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cowboys vs. Wizards | Graybox</title>
  @@PAGE_PREVIEW@@
  <link rel="icon" href="data:,">
  <style>@@STYLE@@</style>
</head>
<body>
  <main id="title-screen" aria-label="Main menu">
    <div class="title-scene">
      <h1><span class="title-matchup"><span class="title-cowboys">Cowboys</span> <span class="title-versus">vs.</span> <span class="title-wizards">Wizards</span></span>@@TITLE_NAME@@</h1>
      <nav aria-label="Main menu">
        <button class="menu-hotspot" id="menu-play" type="button">Play</button>
      </nav>
      @@TITLE_STAGE@@
    </div>
  </main>
  <main id="showdown-camp" aria-label="Camp" hidden></main>
  <main id="showdown-builder" aria-label="Deck builder" hidden></main>
  <main id="showdown" aria-label="Showdown duel" hidden></main>
  <main id="replay-room" aria-label="Showdown Replay Room" hidden>
    <button type="button" id="replay-room-back">Back to Camp</button>
    <div id="replay-room-body"></div>
  </main>
  <script>@@SCRIPT@@</script>
</body>
</html>
