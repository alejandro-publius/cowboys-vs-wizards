<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wraith Drift | Graybox prototype</title>
  <link rel="icon" href="data:,">
  <style>@@STYLE@@</style>
</head>
<body>
  <main>
    <h1>Wraith Drift</h1>
    <p class="blurb" id="blurb"></p>
    <nav id="positions" aria-label="Position">
      <button type="button" data-position="gallows">Gallows Lantern</button>
      <button type="button" data-position="blacksmith">Blacksmith Forge</button>
      <button type="button" data-position="raid">Raid</button>
      <button type="button" data-position="lastStand">Last stand</button>
      <button type="button" data-position="splitTrail">Split Trail</button>
      <button type="button" data-position="rematch">Rematch</button>
    </nav>
    <p id="goal"></p>
    <section id="board" aria-label="Board"></section>
    <div id="actions">
      <button type="button" id="hold">Hold lane</button>
      <button type="button" id="drift">Drift</button>
      <button type="button" id="drift2" hidden>Drift</button>
      <button type="button" id="reset">Reset</button>
    </div>
    <section id="outcome" aria-live="polite"></section>
  </main>
  <script>@@SCRIPT@@</script>
</body>
</html>
